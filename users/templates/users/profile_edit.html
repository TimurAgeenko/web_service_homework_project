{% extends 'users/login_register_base.html' %}

{% block title %}Профиль{% endblock %}

{% block header %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Профиль</h1>
</div>
{% endblock %}

{% block content %}
<ul class="nav nav-underline border-bottom mt-3">
    <li class="nav-item">
        <a class="nav-link text-dark active" href="{% url 'users:login' %}">Редактирование данных</a>
    </li>
</ul>
<div class="mt-3 w-75">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary my-3 w-100">Сохранить</button>
    </form>
</div>
{% endblock %}
