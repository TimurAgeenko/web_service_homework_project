<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <script src="/static/js/bootstrap.bundle.min.js" defer></script>
</head>
<body style="background-color: var(--bs-secondary-bg)">
    <header>
        <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
            <h1 class="display-4">TechStore</h1>
        </div>
    </header>

    <div class="container">
        <div class="row">
            <div class="col-12 col-md-4 mx-auto">
                <div class="card shadow align-items-center border-0">
                    <ul class="nav nav-underline border-bottom mt-3">
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="#">Вход</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="{% url 'users:register' %}">Регистрация</a>
                        </li>
                    </ul>
                    <div class="mt-3 w-75">
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-primary my-3 w-100">Зарегистрироваться</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
