{% extends 'blog/blog_base.html' %}

{% block title %}Удаление поста{% endblock %}

{% block header %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Удалить пост</h1>
</div>
{% endblock %}

{% block content %}
<div class="row text-center justify-content-center g-5">
    <p>Вы уверены, что хотите удалить статью "{{ blog_post.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'blog:admin_page' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
