<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Название страницы{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <script src="/static/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Блог</h5>
    <nav class="navbar-nav flex-row ms-5 w-100 justify-content-between">
        <div class="d-flex flex-row gap-2">
            <a class="p-2 btn btn-outline-primary" href="/blog_home/">Лента</a>
            <a class="p-2 btn btn-outline-primary" href="/blog_post/new/">Добавить статью</a>
            {% if user.is_superuser %}
                <a class="p-2 btn btn-outline-primary" href="/blog_admin_page/">Страница администратора</a>
            {% endif %}
        </div>
        <div class="d-flex flex-row gap-2">
            <a class="p-2 btn btn-outline-primary" href="/home/">Перейти в магазин</a>
            {% if not user.is_authenticated %}
                <a class="p-2 btn btn-primary" href="{% url 'users:login' %}">Войти | Зарегистрироваться</a>
            {% else %}
                <form method="post" action="{% url 'users:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary h-100">Выйти</button>
                </form>
            {% endif %}
        </div>
    </nav>
</div>

{% block header %}{% endblock %}

<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
